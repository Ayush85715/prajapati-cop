<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Prajapati Cop.</title><link rel="stylesheet" href="style.css"></head><body><div class="announcement">Prajapati Cop. • Your Fashion Store</div><header class="header"><a class="logo" href="index.html">Prajapati Cop.</a><nav><a href="index.html">HOME</a><a href="index.html#shop">SHOP</a></nav></header>
<div class="card login-box"><h1 class="page-title">Welcome Back</h1><p class="muted">Login to manage your account.</p><div class="field"><label>Name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><p id="error" class="error">Please enter your name and email.</p><button class="btn dark" style="width:100%" onclick="login()">LOGIN</button><p class="muted" style="font-size:12px;margin-top:18px">Demo admin login: email <b>admin@prajapaticop.com</b> → opens Admin Panel.</p></div>
<script>function login(){let n=name.value.trim(),e=email.value.trim();if(!n||!e){error.style.display='block';return}localStorage.setItem('pcUser',JSON.stringify({name:n,email:e}));localStorage.setItem('pcLoggedIn','1');location.href=e==='admin@prajapaticop.com'?'admin.html':'account.html'}</script></body></html>
