<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Prajapati Cop.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div class="announcement">🚚 FREE SHIPPING on all orders above ₹999 <span>|</span> COD Available</div>
<header class="header"><a class="logo" href="index.html">Prajapati Cop.</a><nav><a href="index.html">HOME</a><a href="index.html#shop">SHOP</a></nav><div class="actions"><button onclick="location.href='account.html'">♙</button><button onclick="location.href='index.html'">🛒</button></div></header>
<main class="checkout-page"><div class="section-heading checkout-heading"><p>SECURE CHECKOUT</p><h2>Complete Your Order</h2></div><div class="checkout-grid"><form id="checkoutForm" class="checkout-card"><h3>Delivery Details</h3><div class="form-grid"><label>Full Name<input required id="name" placeholder="Your full name"></label><label>Phone<input required id="phone" inputmode="numeric" placeholder="10-digit mobile number"></label><label class="wide">Email<input required type="email" id="email" placeholder="you@example.com"></label><label class="wide">Address<input required id="address" placeholder="House no., street, area"></label><label>City<input required id="city" placeholder="Mumbai"></label><label>Pincode<input required id="pincode" inputmode="numeric" placeholder="400001"></label></div><h3>Payment Method</h3><label class="payment-option"><input type="radio" name="payment" value="COD" checked><span><strong>Cash on Delivery (COD)</strong><small>Pay when your order arrives.</small></span></label><label class="payment-option"><input type="radio" name="payment" value="Online"><span><strong>Online Payment</strong><small>UPI / Card — demo mode for now.</small></span></label><button class="btn dark full" type="submit">PLACE ORDER</button><p class="checkout-note">🔒 Your information is stored only in this browser in the current demo.</p></form>
<aside class="order-summary checkout-card"><h3>Order Summary</h3><div id="checkoutItems"></div><div class="summary-row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="summary-row"><span>Shipping</span><strong id="shipping">₹0</strong></div><div class="summary-total"><span>Total</span><strong id="grandTotal">₹0</strong></div></aside></div></main>
<div id="toast"></div><script src="script.js"></script><script>renderCheckout();document.getElementById('checkoutForm').addEventListener('submit',placeOrder);</script></body></html>
